name: Bump Drop

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the cask at Drop's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cask=Casks/drop-desktop-client.rb
          # "Latest" skips the pre-release test builds Drop publishes in between.
          tag=$(gh release view -R Drop-OSS/drop --json tagName -q .tagName)
          arm_asset=$(gh release view -R Drop-OSS/drop "$tag" --json assets \
            -q '.assets[].name | select(test("^Drop\\.Desktop\\.Client_.*_aarch64\\.dmg$"))')
          filever=$(sed -E 's/^Drop\.Desktop\.Client_(.*)_aarch64\.dmg$/\1/' <<<"$arm_asset")
          version="${tag#v},$filever"
          current=$(sed -nE 's/^  version "(.*)"/\1/p' "$cask")
          if [ "$version" = "$current" ]; then
            echo "Already at $version"
            exit 0
          fi

          base="https://github.com/Drop-OSS/drop/releases/download/$tag"
          arm=$(curl -fsSL "$base/Drop.Desktop.Client_${filever}_aarch64.dmg" | sha256sum | cut -d' ' -f1)
          intel=$(curl -fsSL "$base/Drop.Desktop.Client_${filever}_x64.dmg" | sha256sum | cut -d' ' -f1)

          sed -i -E \
            -e "s/^  version \".*\"/  version \"$version\"/" \
            -e "s/(arm: +\")[0-9a-f]{64}/\1$arm/" \
            -e "s/(intel: +\")[0-9a-f]{64}/\1$intel/" \
            "$cask"
          git diff

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "drop-desktop-client ${tag#v}"
          git push
